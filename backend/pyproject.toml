[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "job-match-agent"
version = "0.1.0"
description = "Job match and shortlist agent - scores real live job postings against a candidate profile, drafts cover letters, never auto-submits"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "anthropic>=0.40",
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
  "python-dotenv>=1.0",
  "pydantic>=2.8",
  "truststore>=0.9",
  "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["job_match_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
exclude = []
